<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="260" viewBox="0 0 1200 260"
     role="img" aria-labelledby="wmTitle wmDesc">
  <title id="wmTitle">Maksim Ryzhov — Frontend Product Engineer</title>
  <desc id="wmDesc">Animated wordmark on an off-white field. The name is revealed left to right over thin measurement rules, followed by the line "interfaces · releases · evidence" and the location "Almaty · UTC+5 · remote".</desc>

  <defs>
    <linearGradient id="wmFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FAFAF7" stop-opacity="1"/>
      <stop offset="0.14" stop-color="#FAFAF7" stop-opacity="0"/>
      <stop offset="0.86" stop-color="#FAFAF7" stop-opacity="0"/>
      <stop offset="1" stop-color="#FAFAF7" stop-opacity="1"/>
    </linearGradient>

    <clipPath id="wmCard"><rect width="1200" height="260" rx="26"/></clipPath>

    <clipPath id="wmReveal">
      <rect x="56" y="60" width="0" height="120">
        <animate attributeName="width" values="0;780" dur="1.1s" begin="0.15s"
                 calcMode="spline" keySplines="0.16 1 0.3 1" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="260" rx="26" fill="#FAFAF7"/>

  <g clip-path="url(#wmCard)">
    <g stroke="#E0DCD1" stroke-width="1.5">
      <path d="M64 44 H1136"/><path d="M64 76 H1136"/><path d="M64 108 H1136"/>
      <path d="M64 152 H1136"/><path d="M64 184 H1136"/><path d="M64 216 H1136"/>
    </g>

    <g fill="#A16207">
      <circle cx="64" cy="44" r="3" opacity="0.9">
        <animate attributeName="cx" values="64;1136" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0.9;0" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="64" cy="108" r="3" opacity="0.6">
        <animate attributeName="cx" values="64;1136" dur="6.5s" begin="1.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.6;0.6;0" dur="6.5s" begin="1.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="64" cy="184" r="3" opacity="0.75">
        <animate attributeName="cx" values="64;1136" dur="4.2s" begin="2.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.75;0.75;0" dur="4.2s" begin="2.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="64" cy="76" r="3" opacity="0.5">
        <animate attributeName="cx" values="64;1136" dur="7.4s" begin="3.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.5;0.5;0" dur="7.4s" begin="3.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect width="1200" height="260" fill="url(#wmFade)"/>
  </g>

  <g clip-path="url(#wmReveal)">
    <text x="64" y="148"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="88" font-weight="700" letter-spacing="-2.5" fill="#14110E">Maksim Ryzhov</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace"
     font-size="19" letter-spacing="4">
    <text x="66" y="206" fill="#8C8880" opacity="0">
      interfaces · releases · evidence
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.9s" fill="freeze"/>
    </text>
    <text x="1136" y="206" text-anchor="end" fill="#B0ACA4" opacity="0">
      Almaty · UTC+5 · remote
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.15s" fill="freeze"/>
    </text>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="258.5" rx="25.25"
        fill="none" stroke="#E4E1D9" stroke-width="1.5"/>
</svg>
