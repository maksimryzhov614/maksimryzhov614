<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="rgTitle rgDesc">
  <title id="rgTitle">The 13-check pre-release gate</title>
  <desc id="rgDesc">One command runs a pre-release pipeline of thirteen checks that stops at the first failure: dependency audit, CSP contract, locale contract, consent texts, legal pages, robots, sitemap, canonical domain, license registry, route matrix, accessibility, Lighthouse budgets, and a real Safari pass through safaridriver. Every run writes its evidence to the repository so a reviewer can inspect what was actually verified.</desc>

  <defs>
    <clipPath id="rgCard"><rect width="1200" height="420" rx="26"/></clipPath>
  </defs>

  <rect width="1200" height="420" rx="26" fill="#FAFAF7"/>

  <g font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace">

    <g font-size="15" letter-spacing="3">
      <text x="48" y="54" fill="#8C8880">PRE-RELEASE GATE</text>
      <text x="1152" y="54" text-anchor="end" fill="#B0ACA4">Next.js · nonce CSP · safaridriver · Lighthouse</text>
    </g>
    <path d="M48 74 H1152" stroke="#EBE7DE" stroke-width="1.5"/>

    <g font-size="13" letter-spacing="2.5" fill="#A5A199">
      <text x="48" y="112">ONE COMMAND</text>
      <text x="330" y="112">13 CHECKS · STOP AT FIRST FAILURE</text>
      <text x="900" y="112">EVIDENCE</text>
    </g>

    <rect x="48" y="130" width="234" height="46" rx="10" fill="#F3F0E9" stroke="#E0DCD1" stroke-width="1.5"/>
    <text x="70" y="159" font-size="16" fill="#14110E">release:check</text>

    <g font-size="13" fill="#8C8880">
      <text x="48" y="212">The whole pipeline runs from</text>
      <text x="48" y="232">a single entry point. The first</text>
      <text x="48" y="252">failing check stops the release.</text>
    </g>

    <text x="300" y="160" font-size="18" fill="#A16207">→</text>

    <g font-size="14" fill="#3A362F">
      <g>
        <rect x="330" y="132" width="10" height="10" rx="2" fill="#A16207">
          <animate attributeName="opacity" values="0;1" dur="0.25s" begin="0.20s" fill="freeze"/>
        </rect>
        <text x="352" y="142">dependency audit</text>
      </g>
      <g>
        <rect x="330" y="162" width="10" height="10" rx="2" fill="#A16207">
          <animate attributeName="opacity" values="0;1" dur="0.25s" begin="0.32s" fill="freeze"/>
        </rect>
        <text x="352" y="172">CSP contract</text>
      </g>
      <g>
        <rect x="330" y="192" width="10" height="10" rx="2" fill="#A16207">
          <animate attributeName="opacity" values="0;1" dur="0.25s" begin="0.44s" fill="freeze"/>
        </rect>
        <text x="352" y="202">locale contract</text>
      </g>
      <g>
        <rect x="330" y="222" width="10" height="10" rx="2" fill="#A16207">
          <animate attributeName="opacity" values="0;1" dur="0.25s" begin="0.56s" fill="freeze"/>
        </rect>
        <text x="352" y="232">consent texts</text>
      </g>
      <g>
        <rect x="330" y="252" width="10" height="10" rx="2" fill="#A16207">
          <animate attributeName="opacity" values="0;1" dur="0.25s" begin="0.68s" fill="freeze"/>
        </rect>
        <text x="352" y="262">legal pages</text>
      </g>
      <g>
        <rect x="330" y="282" width="10" height="10" rx="2" fill="#A16207">
          <animate attributeName="opacity" values="0;1" dur="0.25s" begin="0.80s" fill="freeze"/>
        </rect>
        <text x="352" y="292">robots</text>
      </g>
      <g>
        <rect x="330" y="312" width="10" height="10" rx="2" fill="#A16207">
          <animate attributeName="opacity" values="0;1" dur="0.25s" begin="0.92s" fill="freeze"/>
        </rect>
        <text x="352" y="322">sitemap</text>
      </g>

      <g>
        <rect x="590" y="132" width="10" height="10" rx="2" fill="#A16207">
          <animate attributeName="opacity" values="0;1" dur="0.25s" begin="1.04s" fill="freeze"/>
        </rect>
        <text x="612" y="142">canonical domain</text>
      </g>
      <g>
        <rect x="590" y="162" width="10" height="10" rx="2" fill="#A16207">
          <animate attributeName="opacity" values="0;1" dur="0.25s" begin="1.16s" fill="freeze"/>
        </rect>
        <text x="612" y="172">license registry</text>
      </g>
      <g>
        <rect x="590" y="192" width="10" height="10" rx="2" fill="#A16207">
          <animate attributeName="opacity" values="0;1" dur="0.25s" begin="1.28s" fill="freeze"/>
        </rect>
        <text x="612" y="202">route matrix</text>
      </g>
      <g>
        <rect x="590" y="222" width="10" height="10" rx="2" fill="#A16207">
          <animate attributeName="opacity" values="0;1" dur="0.25s" begin="1.40s" fill="freeze"/>
        </rect>
        <text x="612" y="232">accessibility</text>
      </g>
      <g>
        <rect x="590" y="252" width="10" height="10" rx="2" fill="#A16207">
          <animate attributeName="opacity" values="0;1" dur="0.25s" begin="1.52s" fill="freeze"/>
        </rect>
        <text x="612" y="262">Lighthouse budgets</text>
      </g>
      <g>
        <rect x="590" y="282" width="10" height="10" rx="2" fill="#A16207">
          <animate attributeName="opacity" values="0;1" dur="0.25s" begin="1.64s" fill="freeze"/>
        </rect>
        <text x="612" y="292">real Safari pass</text>
      </g>
    </g>

    <text x="862" y="160" font-size="18" fill="#A16207">
      →
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.88s" fill="freeze"/>
    </text>

    <g>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.95s" fill="freeze"/>
      <rect x="900" y="130" width="252" height="104" rx="12" fill="#F3F0E9" stroke="#E0DCD1" stroke-width="1.5"/>
      <text x="922" y="162" font-size="14" fill="#14110E">written to the repository</text>
      <text x="922" y="186" font-size="14" fill="#14110E">on every run</text>
      <text x="922" y="212" font-size="13" fill="#A16207">inspectable by a reviewer</text>
      <g font-size="13" fill="#8C8880">
        <text x="900" y="262">A release leaves a record of</text>
        <text x="900" y="282">what was actually verified,</text>
        <text x="900" y="302">not a claim that it was.</text>
      </g>
    </g>

    <path d="M48 350 H1152" stroke="#EBE7DE" stroke-width="1.5"/>
    <g font-size="14">
      <text x="48" y="382" fill="#6F6B64">Four production locales · RU · EN · KY · DE — copy parity enforced by the gate</text>
      <text x="1152" y="382" text-anchor="end" fill="#B0ACA4">art-square.studio</text>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="25.25"
        fill="none" stroke="#E4E1D9" stroke-width="1.5"/>
</svg>
