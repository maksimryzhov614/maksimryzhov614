<svg xmlns="http://www.w3.org/2000/svg"
     width="600" height="300" viewBox="0 0 600 300"
     role="img" aria-labelledby="hvTitle hvDesc">
  <title id="hvTitle">hermes-vscode</title>
  <desc id="hvDesc">hermes-vscode — an MIT-licensed VS Code extension: a review-first client for a self-hosted agent bridge, carrying files, selection, screenshots, and code edits, where every edit is shown as a diff before it is applied.</desc>

  <rect width="600" height="300" rx="22" fill="#FAFAF7"/>

  <path d="M36 38 H74" stroke="#A16207" stroke-width="3" stroke-linecap="round">
    <animate attributeName="d" values="M36 38 H36;M36 38 H74" dur="0.5s" begin="0.25s"
             calcMode="spline" keySplines="0.16 1 0.3 1" fill="freeze"/>
  </path>

  <g font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace">
    <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.5s" fill="freeze"/>

    <g font-size="12" letter-spacing="2.5" fill="#A5A199">
      <text x="36" y="80">VS CODE EXTENSION</text>
      <text x="564" y="80" text-anchor="end">MIT</text>
    </g>

    <text x="36" y="130"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="34" font-weight="700" letter-spacing="-1" fill="#14110E">hermes-vscode</text>

    <g font-size="13.5" fill="#6F6B64">
      <text x="36" y="172">A review-first client for a self-hosted</text>
      <text x="36" y="194">agent bridge: files, selection, screenshots,</text>
      <text x="36" y="216">and code edits.</text>
    </g>

    <path d="M36 244 H564" stroke="#EBE7DE" stroke-width="1.5"/>
    <text x="36" y="272" font-size="12" letter-spacing="1.5" fill="#A5A199">TypeScript · diff preview before apply</text>
  </g>

  <rect x="0.75" y="0.75" width="598.5" height="298.5" rx="21.25"
        fill="none" stroke="#E4E1D9" stroke-width="1.5"/>
</svg>
